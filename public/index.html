<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <meta
      name="description"
      content="React Asset Management System - Login protected admin panel for managing IT assets"
    />
    <title>Asset Management System</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <script>
      // Apply persisted theme BEFORE Tailwind/React load to avoid a flash of light mode.
      (function () {
        try {
          if (localStorage.getItem('assetMgmtTheme') === 'dark') {
            document.documentElement.classList.add('dark');
          }
        } catch (_) {}
      })();
    </script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            fontFamily: {
              sans: ['Inter', 'ui-sans-serif', 'system-ui', 'sans-serif'],
            },
            animation: {
              'fade-in': 'fadeIn 0.25s ease-out',
              'slide-up': 'slideUp 0.3s cubic-bezier(0.16, 1, 0.3, 1)',
              'scale-in': 'scaleIn 0.2s cubic-bezier(0.16, 1, 0.3, 1)',
            },
            keyframes: {
              fadeIn: { '0%': { opacity: 0 }, '100%': { opacity: 1 } },
              slideUp: {
                '0%': { opacity: 0, transform: 'translateY(16px)' },
                '100%': { opacity: 1, transform: 'translateY(0)' },
              },
              scaleIn: {
                '0%': { opacity: 0, transform: 'scale(0.96)' },
                '100%': { opacity: 1, transform: 'scale(1)' },
              },
            },
          },
        },
      };
    </script>
    <style>
      html { font-family: 'Inter', ui-sans-serif, system-ui, sans-serif; }
      /* Custom scrollbar — subtle, matches both themes */
      ::-webkit-scrollbar { width: 10px; height: 10px; }
      ::-webkit-scrollbar-track { background: transparent; }
      ::-webkit-scrollbar-thumb { background: rgba(148, 163, 184, 0.4); border-radius: 8px; }
      ::-webkit-scrollbar-thumb:hover { background: rgba(148, 163, 184, 0.7); }
      .dark ::-webkit-scrollbar-thumb { background: rgba(71, 85, 105, 0.6); }
      .dark ::-webkit-scrollbar-thumb:hover { background: rgba(100, 116, 139, 0.8); }
    </style>
  </head>
  <body class="bg-white dark:bg-gray-900">
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
  </body>
</html>
